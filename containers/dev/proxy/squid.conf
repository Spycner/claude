# containers/dev/proxy/squid.conf
# Egress allowlist proxy for NET_MODE=proxied dev containers.
# SEED TEMPLATE: run-dev copies this to ~/.config/claude-codex-dev/ on first
# use and mounts the live copy read-only into the proxy container only. Edit
# the live copy on the host, then restart the proxy container. The live copy
# lives outside any repo so no dev container can reach it via /workspace.

http_port 3128

acl allowed_dst dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_dst
http_access deny all

cache deny all
access_log stdio:/dev/stdout
